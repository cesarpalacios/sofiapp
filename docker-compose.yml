# docker-compose.yml — Stack de desarrollo SofiApp
# Levanta el frontend con hot reload accesible desde el host

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sofiapp-dev
    ports:
      - "5173:5173"
    volumes:
      # Montar código fuente para hot reload
      - .:/app
      # Preservar node_modules del container (no sobreescribir con el del host)
      - /app/node_modules
    environment:
      - NODE_ENV=development
    # Hot reload necesita polling en Docker
    command: npm run dev -- --host 0.0.0.0 --force
    restart: unless-stopped
